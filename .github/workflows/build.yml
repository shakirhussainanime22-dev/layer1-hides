name: Build layer1-hide KPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone KernelPatch
        run: |
          git clone --depth=1 --branch main https://github.com/bmax121/KernelPatch.git ../KernelPatch

      - name: Build KPM
        run: |
          export TARGET_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make KP_DIR=${{ github.workspace }}/../KernelPatch TARGET_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer1-hide-kpm
          path: layer1_hide.kpm
