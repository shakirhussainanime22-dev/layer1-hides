name: Build layer1-hide KPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-aarch64-linux-gnu

      - name: Clone KernelPatch
        run: |
          git clone --depth=1 --branch main https://github.com/bmax121/KernelPatch.git ../KernelPatch
          ls ../KernelPatch/kernel/include/

      - name: Build KPM
        run: |
          make TARGET_COMPILE=aarch64-linux-gnu- KP_DIR=${{ github.workspace }}/../KernelPatch
          ls -lh layer1_hide.kpm layer1-hide.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer1-hide-kpm
          path: layer1_hide.kpm
