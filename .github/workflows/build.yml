name: Build layer1-hide KPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang llvm lld

      - name: Clone KernelPatch
        run: |
          git clone --depth=1 --branch main https://github.com/bmax121/KernelPatch.git ../KernelPatch

      - name: Build KPM with Clang
        run: |
          # Define the Clang toolchain prefix for cross-compilation
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make TARGET_COMPILE=aarch64-linux-gnu- KP_DIR=${{ github.workspace }}/../KernelPatch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer1-hide-kpm
          path: layer1_hide.kpm
